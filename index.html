function renderStats() {
  const board = getActiveBoard();
  document.getElementById('stats-board-name').textContent = board.name;
  const history = board.history || [];
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  const colCounts = {};
  COLUMNS.forEach(c => { colCounts[c] = document.querySelectorAll('[data-column="' + c + '"] .task').length; });
  const donutCard = document.createElement('div');
  donutCard.className = 'stat-card';
  donutCard.innerHTML = '<h3>Column distribution</h3><div class="chart">' + buildDonut(colCounts) + '</div>'
    + '<div class="stat-legend">' + COLUMNS.map(c => '<span style="color:' + colColor(c) + '">' + c + ': ' + colCounts[c] + '</span>').join('') + '</div>';
  grid.appendChild(donutCard);
  const weeks = lastNWeekKeys(8);
  const createdPerWeek = {}, donePerWeek = {};
  weeks.forEach(w => { createdPerWeek[w] = 0; donePerWeek[w] = 0; });
  history.forEach(ev => {
    const wk = weekKey(new Date(ev.ts));
    if (!(wk in createdPerWeek)) return;
    if (/^Created|^Task/.test(ev.text)) createdPerWeek[wk]++;
    if (/^Moved to Done/.test(ev.text)) donePerWeek[wk]++;
  });
  const barCard = document.createElement('div');
  barCard.className = 'stat-card';
  barCard.innerHTML = '<h3>Last 8 weeks · created vs done</h3><div class="chart">' + buildBarChart(weeks, createdPerWeek, donePerWeek) + '</div>'
    + '<div class="stat-legend"><span style="color:#a5b4fc">created</span><span style="color:#4ade80">done</span></div>';
  grid.appendChild(barCard);
  let earnedSum = 0, maxSum = 0;
  document.querySelectorAll('.task').forEach(t => {
    const e = parseFloat(t.dataset.earned);
    const m = parseFloat(t.dataset.max);
    if (!isNaN(e)) earnedSum += e;
    if (!isNaN(m)) maxSum += m;
  });
  const pct = maxSum > 0 ? Math.round(earnedSum / maxSum * 100) : 0;
  const ptsCard = document.createElement('div');
  ptsCard.className = 'stat-card';
  ptsCard.innerHTML = '<h3>Points progress</h3>'
    + '<div style="font-size:28px;font-weight:700;margin:6px 0">' + fmtNum(earnedSum) + ' <span style="font-size:14px;color:var(--text-dim)">/ ' + fmtNum(maxSum) + '</span></div>'
    + '<div style="height:10px;background:rgba(128,128,128,0.2);border-radius:5px;overflow:hidden;margin-top:8px">'
    + '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#a5b4fc,#c4b5fd);transition:width 0.5s"></div>'
    + '</div><div style="margin-top:6px;font-size:11px;color:var(--text-dim)">' + pct + '% of total max</div>';
  grid.appendChild(ptsCard);
  const heatCard = document.createElement('div');
  heatCard.className = 'stat-card';
  heatCard.innerHTML = '<h3>Activity heatmap (last 26 weeks)</h3><div class="chart">' + buildHeatmap(history) + '</div>';
  grid.appendChild(heatCard);
}

function colColor(c) { return { backlog: '#8b8fa8', todo: '#a5b4fc', doing: '#fbbf24', done: '#4ade80' }[c] || '#8b8fa8'; }
function buildDonut(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  if (total === 0) return '<div style="color:var(--text-dim);font-size:12px">No tasks yet</div>';
  const r = 50, c = 60, stroke = 18;
  let angle = -Math.PI / 2;
  let svg = '<svg viewBox="0 0 120 120" width="140" height="140">';
  COLUMNS.forEach(col => {
    const n = counts[col];
    if (n === 0) return;
    const frac = n / total;
    const endAngle = angle + frac * 2 * Math.PI;
    const x1 = c + r * Math.cos(angle);
    const y1 = c + r * Math.sin(angle);
    const x2 = c + r * Math.cos(endAngle);
    const y2 = c + r * Math.sin(endAngle);
    const large = frac > 0.5 ? 1 : 0;
    svg += '<path d="M' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x2 + ',' + y2 + '" fill="none" stroke="' + colColor(col) + '" stroke-width="' + stroke + '"/>';
    angle = endAngle;
  });
  svg += '<text x="60" y="60" text-anchor="middle" dominant-baseline="middle" fill="#e4e6f0" font-size="20" font-weight="700">' + total + '</text>';
  svg += '</svg>';
  return svg;
}
function lastNWeekKeys(n) {
  const keys = [];
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d);
    x.setDate(x.getDate() - i * 7);
    keys.push(weekKey(x));
  }
  return keys;
}
function weekKey(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function buildBarChart(weeks, created, done) {
  const W = 400, H = 110, padL = 20, padB = 16;
  const maxVal = Math.max(1, ...weeks.map(w => Math.max(created[w] || 0, done[w] || 0)));
  const groupW = (W - padL * 2) / weeks.length;
  const barW = groupW / 3;
  let svg = '<svg viewBox="0 0 ' + W + ' ' + (H + padB) + '" width="100%" style="max-width:420px">';
  weeks.forEach((w, i) => {
    const x = padL + i * groupW;
    const hC = ((created[w] || 0) / maxVal) * (H - 10);
    const hD = ((done[w] || 0) / maxVal) * (H - 10);
    svg += '<rect x="' + x + '" y="' + (H - hC) + '" width="' + barW + '" height="' + hC + '" fill="#a5b4fc" rx="2"/>';
    svg += '<rect x="' + (x + barW + 2) + '" y="' + (H - hD) + '" width="' + barW + '" height="' + hD + '" fill="#4ade80" rx="2"/>';
    svg += '<text x="' + (x + barW) + '" y="' + (H + 12) + '" text-anchor="middle" font-size="8.5" fill="#8b8fa8">' + w.slice(5) + '</text>';
  });
  svg += '</svg>';
  return svg;
}
function buildHeatmap(history) {
  const dayCount = {};
  history.forEach(ev => {
    const d = new Date(ev.ts);
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    dayCount[k] = (dayCount[k] || 0) + 1;
  });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - 7 * 26);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const cellSize = 10, gap = 2;
  const weeks = 27;
  const W = weeks * (cellSize + gap);
  const H = 7 * (cellSize + gap);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:500px">';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    if (d > today) continue;
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const count = dayCount[k] || 0;
    const week = Math.floor(i / 7);
    const day = i % 7;
    const x = week * (cellSize + gap);
    const y = day * (cellSize + gap);
    let fill = 'rgba(128,128,128,0.08)';
    if (count > 0) fill = 'rgba(102,126,234,' + Math.min(1, 0.2 + count * 0.15) + ')';
    svg += '<rect x="' + x + '" y="' + y + '" width="' + cellSize + '" height="' + cellSize + '" rx="1.5" fill="' + fill + '"><title>' + k + ': ' + count + '</title></rect>';
  }
  svg += '</svg>';
  return svg;
}

document.getElementById('btn-csv').addEventListener('click', () => {
  const rows = [['column','text','priority','due','earned','max','tags','notes','subtasks','blocked_by','cum_laude']];
  document.querySelectorAll('.column').forEach(col => {
    col.querySelectorAll('.task').forEach(t => {
      const subs = JSON.parse(t.dataset.subtasks || '[]');
      const bb = JSON.parse(t.dataset.blockedBy || '[]').map(id => {
        const el = findTaskById(id);
        return el ? el.querySelector('.task-text').textContent : id;
      });
      rows.push([
        col.dataset.column,
        t.querySelector('.task-text').textContent,
        t.dataset.priority || '',
        t.dataset.due || '',
        t.dataset.earned || '',
        t.dataset.max || '',
        JSON.parse(t.dataset.tags || '[]').map(x => '#' + x).join(' '),
        t.dataset.notes || '',
        subs.map(s => (s.done ? '[x] ' : '[ ] ') + s.text).join('; '),
        bb.join('; '),
        t.classList.contains('cum-laude') ? 'YES' : ''
      ]);
    });
  });
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kanban-' + new Date().toISOString().slice(0, 10) + '.csv';

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

});

document.getElementById('file-import').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object') throw new Error('not a valid backup');
      if (data.app === 'kanban-mephi' && data.board && data.board.tasks) {
        const newId = 'board-' + genId();
        const board = { ...data.board, id: newId };
        COLUMNS.forEach(c => { (board.tasks[c] || []).forEach(t => { if (!Array.isArray(t.blockedBy)) t.blockedBy = []; }); });
        if (!board.tagColors) board.tagColors = {};
        appState.boards[newId] = board;
        appState.activeBoardId = newId;
        if (data.settings) appState.settings = { ...appState.settings, ...data.settings };
      } else if (data.tasks && typeof data.tasks === 'object') {
        const id = 'board-' + genId();
        const board = { id, name: 'Imported', tasks: data.tasks, colors: {}, tagColors: {}, background: data.background || null, history: data.history || [], archive: data.archive || [] };
        COLUMNS.forEach(c => { (board.tasks[c] || []).forEach(t => { if (!t.id) t.id = genId(); if (!Array.isArray(t.subtasks)) t.subtasks = []; if (!Array.isArray(t.blockedBy)) t.blockedBy = []; }); });
        appState.boards[id] = board;
        appState.activeBoardId = id;
      } else if (data.backlog || data.todo || data.doing || data.done) {
        const id = 'board-' + genId();
        const board = { id, name: 'Imported', tasks: { backlog: [], todo: [], doing: [], done: [] }, colors: {}, tagColors: {}, background: null, history: [], archive: [] };
        COLUMNS.forEach(c => {
          (data[c] || []).forEach(t => {
            board.tasks[c].push({
              id: genId(), text: t.text || '', priority: t.priority || 'medium',
              earned: t.earned || t.points || '', max: t.max || '', due: t.due || '',
              tags: Array.isArray(t.tags) ? t.tags : [], notes: t.notes || '',
              subtasks: Array.isArray(t.subtasks) ? t.subtasks : [],
              blockedBy: []
            });
          });
        });
        appState.boards[id] = board;
        appState.activeBoardId = id;
      } else throw new Error('unrecognized format');
      persist();
      renderBoardMenu();
      renderActiveBoard();
      debouncedSync();
      showToast('Imported successfully');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
});
